name: meshsentinel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noc}
      POSTGRES_DB: ${POSTGRES_DB:-noc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc} -d ${POSTGRES_DB:-noc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [noc]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [noc]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      NOC_DATABASE_URL: ${NOC_DATABASE_URL:-postgresql+asyncpg://noc:noc@postgres:5432/noc}
      NOC_REDIS_URL: redis://redis:6379/0
      NOC_GATEWAY_LAUNCHER_URL: http://gateway-launcher:9000
      NOC_BACKUP_DIR: /backups
      NOC_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-20}
      OFFLINE_MINUTES_WARNING: ${OFFLINE_MINUTES_WARNING:-30}
      OFFLINE_PERCENT_WARNING: ${OFFLINE_PERCENT_WARNING:-5}
      OFFLINE_PERCENT_CRITICAL: ${OFFLINE_PERCENT_CRITICAL:-20}
      SNR_DEGRADED_THRESHOLD: ${SNR_DEGRADED_THRESHOLD:--15}
      NOC_ADMIN_RATE_LIMIT_PER_MINUTE: ${NOC_ADMIN_RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backups-data:/backups
    networks: [noc]
    restart: unless-stopped

  # ── Lanzador de gateways (ADR 0028) ───────────────────────────────────────
  # Crea/destruye contenedores gateway bajo demanda (desde "+ Añadir
  # gateway" en la interfaz) hablando con el socket de Docker. Es el ÚNICO
  # servicio que lo monta — deliberadamente aislado del backend, que tiene
  # una API HTTP con usuarios autenticados y por tanto más superficie de
  # ataque (ver ADR 0028 §1). Sin puertos publicados: solo se habla con él
  # desde dentro de esta red.
  #
  # /dev montado solo lectura: le basta para LISTAR dispositivos USB del
  # host (GET /devices); el mapeo real de un dispositivo a un contenedor
  # nuevo lo hace el propio daemon de Docker al crearlo, sin que el
  # lanzador necesite verlo también él. Sustituye por completo a la antigua
  # piscina estática de 6 contenedores idle (M6.3, retirada).
  gateway-launcher:
    build: ./launcher
    environment:
      LAUNCHER_GATEWAY_IMAGE: meshsentinel-gateway:local
      LAUNCHER_DOCKER_NETWORK: meshsentinel
      LAUNCHER_GATEWAY_REDIS_URL: redis://redis:6379/0
      LAUNCHER_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev:ro
    networks: [noc]
    restart: unless-stopped

  # Pasarela original: arranca desde variables de entorno (ADR 0021 §1,
  # compatibilidad total, sin cambios) — no la crea ni la destruye el
  # lanzador. Imagen etiquetada explícitamente: es la que
  # `gateway-launcher` instancia para cualquier pasarela nueva que se cree
  # desde la interfaz ("LAUNCHER_GATEWAY_IMAGE" arriba debe coincidir).
  #
  # Para USB en un host Linux (Docker SÍ puede pasar dispositivos ahí, a
  # diferencia de Docker Desktop en Mac): añade
  #   devices:
  #     - "/dev/ttyACM0:/dev/ttyACM0"
  # No uses privileged: true — mapear el dispositivo concreto basta. Las
  # pasarelas creadas desde "+ Añadir gateway" no necesitan este paso a
  # mano: el lanzador mapea el dispositivo elegido automáticamente.
  gateway:
    # scale: 0 — nunca arranca contenedor con un `docker compose up` normal
    # (pedido explícito del usuario: no quiere ver una pasarela simulada por
    # defecto), pero SIGUE construyéndose con `docker compose build` (a
    # diferencia de `profiles`, que también excluiría el build) — es la
    # imagen que `gateway-launcher` instancia para cualquier pasarela nueva
    # creada desde la interfaz. Para arrancar este contenedor concreto a
    # mano: `docker compose up -d --scale gateway=1 gateway`.
    scale: 0
    build: ./gateway
    image: meshsentinel-gateway:local
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-01}
      GATEWAY_TRANSPORT: ${GATEWAY_TRANSPORT:-simulated}
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks: [noc]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${NOC_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    networks: [noc]
    restart: unless-stopped

networks:
  noc:
    name: meshsentinel

volumes:
  postgres-data:
  redis-data:
  backups-data:
