name: meshtastic-noc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noc}
      POSTGRES_DB: ${POSTGRES_DB:-noc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc} -d ${POSTGRES_DB:-noc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      NOC_DATABASE_URL: ${NOC_DATABASE_URL:-postgresql+asyncpg://noc:noc@postgres:5432/noc}
      NOC_REDIS_URL: redis://redis:6379/0
      NOC_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-20}
      OFFLINE_MINUTES_WARNING: ${OFFLINE_MINUTES_WARNING:-30}
      OFFLINE_PERCENT_WARNING: ${OFFLINE_PERCENT_WARNING:-5}
      OFFLINE_PERCENT_CRITICAL: ${OFFLINE_PERCENT_CRITICAL:-20}
      SNR_DEGRADED_THRESHOLD: ${SNR_DEGRADED_THRESHOLD:--15}
      NOC_ADMIN_RATE_LIMIT_PER_MINUTE: ${NOC_ADMIN_RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Piscina de gateways (M6.3) ──────────────────────────────────────────
  # Los 6 arrancan con transporte "idle": no conectan a nada, solo laten
  # como "unassigned" hasta que se reclaman desde "+ Añadir gateway" en la
  # interfaz — el asistente los reconfigura (USB/TCP) en caliente por
  # comando, sin tocar este archivo ni reconstruir nada. Cero
  # preconfiguración en .env por diseño (pedido explícito del usuario):
  # transporte, dispositivo USB, host TCP... todo vive en la base de datos,
  # nunca en variables de entorno. GATEWAY_ID sigue leyendo de .env solo
  # para el primero (compatibilidad de nombre, "gw-01" por defecto) — es
  # una etiqueta de infraestructura, no configuración de aplicación. Ajusta
  # la cantidad de bloques si necesitas más o menos disponibles.
  #
  # Para USB en un host Linux (Docker SÍ puede pasar dispositivos ahí, a
  # diferencia de Docker Desktop en Mac): añade a cualquier bloque
  #   devices:
  #     - "/dev/ttyACM0:/dev/ttyACM0"
  # No uses privileged: true — mapear el dispositivo concreto basta.
  gateway:
    build: ./gateway
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-01}
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway-2:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-02
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway-3:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-03
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway-4:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-04
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway-5:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-05
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway-6:
    build: ./gateway
    environment:
      GATEWAY_ID: gw-06
      GATEWAY_TRANSPORT: idle
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${NOC_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
