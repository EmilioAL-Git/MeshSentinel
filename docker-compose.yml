name: meshsentinel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noc}
      POSTGRES_DB: ${POSTGRES_DB:-noc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc} -d ${POSTGRES_DB:-noc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [noc]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [noc]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      NOC_DATABASE_URL: ${NOC_DATABASE_URL:-postgresql+asyncpg://noc:noc@postgres:5432/noc}
      NOC_REDIS_URL: redis://redis:6379/0
      NOC_GATEWAY_LAUNCHER_URL: http://gateway-launcher:9000
      NOC_BACKUP_DIR: /backups
      NOC_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-20}
      OFFLINE_MINUTES_WARNING: ${OFFLINE_MINUTES_WARNING:-30}
      OFFLINE_PERCENT_WARNING: ${OFFLINE_PERCENT_WARNING:-5}
      OFFLINE_PERCENT_CRITICAL: ${OFFLINE_PERCENT_CRITICAL:-20}
      SNR_DEGRADED_THRESHOLD: ${SNR_DEGRADED_THRESHOLD:--15}
      NOC_ADMIN_RATE_LIMIT_PER_MINUTE: ${NOC_ADMIN_RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backups-data:/backups
    networks: [noc]
    restart: unless-stopped

  # Lanzador de gateways (ADR 0028): crea/destruye contenedores gateway desde
  # la UI. Es el ÚNICO servicio con el socket de Docker (aislado del backend).
  # Sin puertos publicados. /dev solo lectura: solo para listar USB.
  gateway-launcher:
    build: ./launcher
    environment:
      LAUNCHER_GATEWAY_IMAGE: meshsentinel-gateway:local
      LAUNCHER_DOCKER_NETWORK: meshsentinel
      LAUNCHER_GATEWAY_REDIS_URL: redis://redis:6379/0
      LAUNCHER_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev:ro
    networks: [noc]
    restart: unless-stopped

  # Pasarela original por variables de entorno (no la gestiona el lanzador).
  # Su imagen es la que el lanzador instancia (LAUNCHER_GATEWAY_IMAGE).
  # USB en Linux: añadir `devices: ["/dev/ttyACM0:/dev/ttyACM0"]` (sin privileged).
  gateway:
    # scale: 0 = no arranca solo con `up`, pero sí se construye (la imagen
    # la usa el lanzador). A mano: `docker compose up -d --scale gateway=1 gateway`
    scale: 0
    build: ./gateway
    image: meshsentinel-gateway:local
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-01}
      GATEWAY_TRANSPORT: ${GATEWAY_TRANSPORT:-simulated}
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_LOG_LEVEL: ${NOC_LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks: [noc]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${NOC_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    networks: [noc]
    restart: unless-stopped

networks:
  noc:
    name: meshsentinel

volumes:
  postgres-data:
  redis-data:
  backups-data:
